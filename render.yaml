services:
  - type: web
    name: coldstart-kitchen
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: coldstart-db
          property: connectionString
      - key: DEMO_USER
        value: demo
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: coldstart-db
    plan: free
    databaseName: coldstart
    user: coldstart
