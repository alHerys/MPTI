{% extends "base.html" %}
{% block title %}Masuk — ColdStart Kitchen{% endblock %}
{% block content %}
<section class="login-card">
  <h1>ColdStart Kitchen</h1>
  <p class="muted">Rekomendasi jumlah produksi untuk warung tanpa data histori.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label for="username">Nama pengguna</label>
    <input id="username" name="username" autocomplete="username" required value="demo">
    <label for="password">Kata sandi</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Masuk</button>
  </form>
  <p class="muted small">Akun demo: demo / demo123</p>
</section>
{% endblock %}
